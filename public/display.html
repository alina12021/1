<!DOCTYPE html>
<html>
<head>
<title>Очередь</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:black;
    overflow-x:hidden;
}



@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.05);}
    100%{transform:scale(1);}
}



.header{

    background:white;

    border-bottom:6px solid #1e3cff;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    position:relative;
}

.header-title{

    font-size:38px;
    font-weight:bold;

    color:black;
}

.logo{

    position:absolute;

    left:20px;
    top:10px;

    width:70px;
}



.current-box{

    background:#7a7a7a;

    text-align:center;

    padding:40px 20px;
}

.current-text{

    font-size:28px;

    color:black;
}

.current-number{

    font-size:100px;

    font-weight:bold;

    color:#1e3cff;

    animation:pulse 2s infinite;
}



.main{

    display:grid;

    grid-template-columns:
        260px
        1fr
        260px;

    gap:20px;

    align-items:start;

    padding:20px;
}



.left-side,
.right-side{

    display:flex;
    flex-direction:column;
    align-items:center;

    gap:20px;
}



.side-photo{

    width:240px;

    aspect-ratio:9 / 16;

    object-fit:cover;

    border-radius:20px;

    border:3px solid #1e3cff;

    box-shadow:0 0 25px rgba(30,60,255,0.5);

    transition:0.5s;

    animation:fadeIn 0.5s ease;
}

.side-photo:hover{
    transform:scale(1.02);
}



.ad-text{

    width:100%;

    background:rgba(0,0,0,0.7);

    color:white;

    padding:15px;

    border-radius:14px;

    text-align:left;

    font-size:16px;

    line-height:1.6;

    position:relative;

    z-index:5;

    animation:fadeIn 0.5s ease;
}



.queue-center{
    width:100%;
}



.queue{

    background:#f2f2f2;

    border-radius:20px;

    padding:30px;

    min-height:600px;
}



.queue-row{

    display:grid;

    grid-template-columns:
        1fr
        2fr
        1fr;

    margin:15px 0;

    padding-bottom:14px;

    border-bottom:2px solid #d9d9d9;

    font-size:28px;

    color:black;

    animation:fadeIn 0.4s ease;
}

.num{
    font-weight:bold;
}

.name{
    text-align:center;
}

.desk{
    text-align:right;
}

.first{

    color:#1e3cff;

    font-weight:bold;

    transform:scale(1.03);
}



@media(max-width:1200px){

    .main{
        grid-template-columns:1fr;
    }

    .left-side,
    .right-side{
        display:none;
    }

    .current-number{
        font-size:60px;
    }

    .queue-row{
        font-size:18px;
    }
}

</style>
</head>

<body>



<div class="header">

    <img src="/logo.png" class="logo">

    <div class="header-title">
        ЭЛЕКТРОННАЯ ОЧЕРЕДЬ
    </div>

</div>



<div class="current-box">

    <div class="current-text">
        СЕЙЧАС ОБСЛУЖИВАЕТСЯ:
    </div>

    <div id="current" class="current-number">
        ---
    </div>

</div>



<div class="main">

    

    <div class="left-side">

        <img
            id="leftSlide"
            src="/left1.jpg"
            class="side-photo"
        >

        <div
            class="ad-text"
            id="leftText"
        >
            Добро пожаловать
        </div>

    </div>

    

    <div class="queue-center">

        <div class="queue" id="queue"></div>

    </div>

    

    <div class="right-side">

        <img
            id="rightSlide"
            src="/right1.jpeg"
            class="side-photo"
        >

        <div
            class="ad-text"
            id="rightText"
        >
            Подготовьте документы
        </div>

    </div>

</div>

<script>



let lastQueue = "";
let lastNumber = null;

const audio = new Audio("sound.mp3");

async function loadAll(){

    

    let current =
        await fetch("/current")
        .then(r => r.json());

    

    if(current && current.number !== lastNumber){

        audio.play().catch(()=>{});

        lastNumber = current.number;
    }

    document.getElementById("current").innerHTML =
        current ? current.number : "---";

    

    let data =
        await fetch("/queue")
        .then(r => r.json());

    let newData =
        JSON.stringify(data);

    

    if(newData === lastQueue)
        return;

    lastQueue = newData;

    let container =
        document.getElementById("queue");

    container.innerHTML = "";

    data.forEach((p,index)=>{

        let div =
            document.createElement("div");

        div.className =
            "queue-row";

        

        if(index === 0){

            div.classList.add("first");
        }

        div.innerHTML = `

            <div class="num">
                ${p.number}
            </div>

            <div class="name">
                ${p.name}
            </div>

            <div class="desk">
                стол ${p.desk}
            </div>

        `;

        container.appendChild(div);
    });
}



setInterval(loadAll,2000);

loadAll();



const slides = [

{
    left:"/left1.jpeg",
    right:"/right1.jpeg",

    leftText:`
    Добро пожаловать в приемную комиссию<br>
    Қабылдау комиссиясына қош келдіңіз<br>
    Welcome to the admissions office
    `,

    rightText:`
    Подготовьте документы заранее<br>
    Құжаттарды алдын ала дайындаңыз<br>
    Prepare your documents in advance
    `
},

{
    left:"/left2.jpeg",
    right:"/right2.jpeg",

    leftText:`
    Следите за номером очереди<br>
    Кезек нөмірін бақылаңыз<br>
    Watch your queue number
    `,

    rightText:`
    Подойдите к указанному столу<br>
    Көрсетілген үстелге өтіңіз<br>
    Proceed to the assigned desk
    `
},

{
    left:"/left3.jpeg",
    right:"/right3.jpeg",

    leftText:`
    Спасибо за ожидание<br>
    Күткеніңізге рақмет<br>
    Thank you for waiting
    `,

    rightText:`
    Желаем удачного поступления<br>
    Сәтті оқуға түсуіңізге тілектеспіз<br>
    We wish you successful admission
    `
}

];

let currentSlide = 0;

function rotateAds(){

    document.getElementById("leftSlide").src =
        slides[currentSlide].left;

    document.getElementById("rightSlide").src =
        slides[currentSlide].right;

    document.getElementById("leftText").innerHTML =
        slides[currentSlide].leftText;

    document.getElementById("rightText").innerHTML =
        slides[currentSlide].rightText;

    currentSlide++;

    if(currentSlide >= slides.length){

        currentSlide = 0;
    }
}



rotateAds();



setInterval(rotateAds,30000);

</script>

</body>
</html>
