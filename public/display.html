<!DOCTYPE html>
<html>
<head>
<title>Очередь</title>
<style>
body{
    margin:0;
    background:#111;
    font-family:Arial, sans-serif;
    display:flex;
    height:100vh;
    overflow:hidden;
}
.side{
    width:22%;
    display:flex;
    flex-direction:column;
    background:#1a1a1a;
}
.side-photo{
    height:65%;
    position:relative;
    overflow:hidden;
    background:black;
}
.slide{
    position:absolute;
    inset:0;
    opacity:0;
    transition:opacity 1s ease;
}
.slide.active{
    opacity:1;
}
.slide img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}
.side-text{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    background:#111;
    border-top:3px solid #1e3cff;
    box-sizing:border-box;
}
.side-text p{
    margin:0;
    color:white;
    font-size:16px;
    line-height:1.9;
    font-weight:bold;
    text-align:center;
}
.center{
    width:56%;
    background:#f2f2f2;
    display:flex;
    flex-direction:column;
}
.header{
    background:white;
    border-bottom:6px solid #1e3cff;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    position:relative;
}
.logo{
    position:absolute;
    left:20px;
    width:70px;
}
.header-title{
    font-size:38px;
    font-weight:bold;
    color:black;
}
.current-box{
    background:#7a7a7a;
    text-align:center;
    padding:35px 20px;
}
.current-text{
    font-size:28px;
    color:black;
}
.current-number{
    font-size:100px;
    font-weight:bold;
    color:#1e3cff;
    animation:pulse 2s infinite;
}
.queue{
    flex:1;
    overflow:hidden;
    padding:25px;
}
.queue-row{
    display:grid;
    grid-template-columns:1fr 2fr 1fr;
    align-items:center;
    padding:18px 10px;
    border-bottom:2px solid #d9d9d9;
    font-size:28px;
    color:black;
    animation:fadeIn 0.4s ease;
}
.num{ font-weight:bold; }
.name{ text-align:center; }
.desk{ text-align:right; }
.first{
    color:#1e3cff;
    font-weight:bold;
    background:#e9edff;
    border-radius:12px;
}
@keyframes fadeIn{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
}
@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.05);}
    100%{transform:scale(1);}
}
@media(max-width:1200px){
    .side{display:none;}
    .center{width:100%;}
    .current-number{font-size:70px;}
    .queue-row{font-size:18px;}
}
</style>
</head>
<body>

<div class="side">
    <div class="side-photo" id="leftPhoto"></div>
    <div class="side-text"><p id="leftText">—</p></div>
</div>

<div class="center">
    <div class="header">
        <img src="/logo.png" class="logo">
        <div class="header-title">ПРИЁМНАЯ КОМИССИЯ</div>
    </div>
    <div class="current-box">
        <div class="current-text">СЕЙЧАС ОБСЛУЖИВАЕТСЯ</div>
        <div id="current" class="current-number">---</div>
    </div>
    <div class="queue" id="queue"></div>
</div>

<div class="side">
    <div class="side-photo" id="rightPhoto"></div>
    <div class="side-text"><p id="rightText">—</p></div>
</div>

<script>
var slides = [
    {
        left:"/left1.jpeg",
        right:"/right1.jpeg",
        text:"🎓 15+ IT и технических специальностей\n🎓 15+ IT және техникалық мамандықтар\n🎓 15+ IT and technical specialties"
    },
    {
        left:"/left2.jpeg",
        right:"/right2.jpeg",
        text:"🏆 Победители WorldSkills Kazakhstan\n🏆 WorldSkills Kazakhstan жеңімпаздары\n🏆 Winners of WorldSkills Kazakhstan"
    },
    {
        left:"/left3.jpeg",
        right:"/right3.jpeg",
        text:"💻 Современные лаборатории и IT-классы\n💻 Заманауи зертханалар мен IT сыныптары\n💻 Modern laboratories and IT classrooms"
    },
    {
        left:"/left4.jpeg",
        right:"/right4.jpeg",
        text:"🚀 Подготовка востребованных IT-специалистов\n🚀 Сұранысқа ие IT мамандарын даярлау\n🚀 Training highly demanded IT specialists"
    }
];

var leftPhoto = document.getElementById("leftPhoto");
var rightPhoto = document.getElementById("rightPhoto");
var leftText = document.getElementById("leftText");
var rightText = document.getElementById("rightText");

for(var i = 0; i < slides.length; i++){
    var ld = document.createElement("div");
    ld.className = i === 0 ? "slide active" : "slide";
    ld.innerHTML = '<img src="' + slides[i].left + '">';
    leftPhoto.appendChild(ld);

    var rd = document.createElement("div");
    rd.className = i === 0 ? "slide active" : "slide";
    rd.innerHTML = '<img src="' + slides[i].right + '">';
    rightPhoto.appendChild(rd);
}

leftText.innerText = slides[0].text;
rightText.innerText = slides[0].text;

var currentSlide = 0;

function rotateAds(){
    var leftSlides = leftPhoto.querySelectorAll(".slide");
    var rightSlides = rightPhoto.querySelectorAll(".slide");
    var next = (currentSlide + 1) % slides.length;

    leftSlides[currentSlide].classList.remove("active");
    rightSlides[currentSlide].classList.remove("active");
    leftSlides[next].classList.add("active");
    rightSlides[next].classList.add("active");

    leftText.innerText = slides[next].text;
    rightText.innerText = slides[next].text;

    currentSlide = next;
}

setInterval(rotateAds, 30000);

var lastNumber = null;
var lastQueue = "";

function loadAll(){
    fetch("/current")
    .then(function(r){ return r.json(); })
    .then(function(current){
        if(current && current.number !== lastNumber){
            lastNumber = current.number;
        }
        document.getElementById("current").innerText = current ? current.number : "---";
    })
    .catch(function(){});

    fetch("/queue")
    .then(function(r){ return r.json(); })
    .then(function(data){
        var newData = JSON.stringify(data);
        if(newData === lastQueue) return;
        lastQueue = newData;

        var container = document.getElementById("queue");
        container.innerHTML = "";

        data.forEach(function(p, index){
            var div = document.createElement("div");
            div.className = index === 0 ? "queue-row first" : "queue-row";
            div.innerHTML =
                '<div class="num">' + p.number + '</div>' +
                '<div class="name">' + p.name + '</div>' +
                '<div class="desk">стол ' + p.desk + '</div>';
            container.appendChild(div);
        });
    })
    .catch(function(){});
}

setInterval(loadAll, 2000);
loadAll();
</script>

</body>
</html>
