<!DOCTYPE html>
<html>
<head>
<title>Очередь</title>
<style>
body{
    margin:0;
    background:#111;
    font-family:Arial, sans-serif;
    display:flex;
    height:100vh;
    overflow:hidden;
}
.side{
    width:22%;
    display:flex;
    flex-direction:column;
}
.side-photo{
    height:55%;
    position:relative;
    overflow:hidden;
    background:black;
}
.slide{
    position:absolute;
    inset:0;
    opacity:0;
    transition:opacity 1s ease;
}
.slide.active{
    opacity:1;
}
.slide img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}
.side-text{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:14px 12px;
    box-sizing:border-box;
    background:linear-gradient(135deg, #0a0a2e 0%, #1a1a4e 100%);
    border-top:3px solid #1e3cff;
    gap:12px;
}
.text-line{
    display:flex;
    align-items:flex-start;
    gap:10px;
    width:100%;
}
.text-line .emoji{
    font-size:22px;
    flex-shrink:0;
    margin-top:2px;
}
.text-line .langs{
    display:flex;
    flex-direction:column;
    gap:3px;
}
.text-line .ru{
    color:#ffffff;
    font-size:16px;
    font-weight:bold;
    line-height:1.3;
}
.text-line .kz{
    color:#c0d0ff;
    font-size:14px;
    font-weight:bold;
    line-height:1.3;
}
.text-line .en{
    color:#90aaee;
    font-size:13px;
    font-style:italic;
    line-height:1.3;
}
.center{
    width:56%;
    background:#f2f2f2;
    display:flex;
    flex-direction:column;
}
.header{
    background:white;
    border-bottom:6px solid #1e3cff;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    position:relative;
}
.logo{
    position:absolute;
    left:20px;
    width:70px;
}
.header-title{
    font-size:38px;
    font-weight:bold;
    color:black;
}
.current-box{
    background:#7a7a7a;
    text-align:center;
    padding:35px 20px;
}
.current-text{
    font-size:28px;
    color:black;
}
.current-number{
    font-size:100px;
    font-weight:bold;
    color:#1e3cff;
    animation:pulse 2s infinite;
}
.queue{
    flex:1;
    overflow:hidden;
    padding:25px;
}
.queue-row{
    display:grid;
    grid-template-columns:1fr 2fr 1fr;
    align-items:center;
    padding:18px 10px;
    border-bottom:2px solid #d9d9d9;
    font-size:28px;
    color:black;
    animation:fadeIn 0.4s ease;
}
.num{ font-weight:bold; }
.name{ text-align:center; }
.desk{ text-align:right; }
.first{
    color:#1e3cff;
    font-weight:bold;
    background:#e9edff;
    border-radius:12px;
}
@keyframes fadeIn{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
}
@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.05);}
    100%{transform:scale(1);}
}
@media(max-width:1200px){
    .side{display:none;}
    .center{width:100%;}
    .current-number{font-size:70px;}
    .queue-row{font-size:18px;}
}
</style>
</head>
<body>

<div class="side">
    <div class="side-photo" id="leftPhoto"></div>
    <div class="side-text" id="leftText"></div>
</div>

<div class="center">
    <div class="header">
        <img src="/logo.png" class="logo">
        <div class="header-title">ПРИЁМНАЯ КОМИССИЯ</div>
    </div>
    <div class="current-box">
        <div class="current-text">СЕЙЧАС ОБСЛУЖИВАЕТСЯ</div>
        <div id="current" class="current-number">---</div>
    </div>
    <div class="queue" id="queue"></div>
</div>

<div class="side">
    <div class="side-photo" id="rightPhoto"></div>
    <div class="side-text" id="rightText"></div>
</div>

<script>
var leftSlides = [
    {
        img:"/left1.jpeg",
        lines:[
            { emoji:"🎓", ru:"15+ IT и технических специальностей", kz:"15+ IT және техникалық мамандықтар", en:"15+ IT & technical specialties" },
            { emoji:"💡", ru:"Программирование, робототехника, кибербезопасность", kz:"Бағдарламалау, робототехника, киберқауіпсіздік", en:"Programming, robotics, cybersecurity" }
        ]
    },
    {
        img:"/left2.jpeg",
        lines:[
            { emoji:"🏆", ru:"Победители WorldSkills Kazakhstan", kz:"WorldSkills Kazakhstan жеңімпаздары", en:"WorldSkills Kazakhstan winners" },
            { emoji:"🥇", ru:"Лучшие результаты среди колледжей области Абай", kz:"Абай облысы колледждері арасындағы үздік нәтижелер", en:"Top results among Abai region colleges" }
        ]
    },
    {
        img:"/left3.jpeg",
        lines:[
            { emoji:"💻", ru:"Современные IT-классы и лаборатории", kz:"Заманауи IT сыныптары мен зертханалар", en:"Modern IT labs & classrooms" },
            { emoji:"🔬", ru:"Оборудование мирового уровня для практики", kz:"Тәжірибе үшін әлемдік деңгейдегі жабдық", en:"World-class equipment for hands-on training" }
        ]
    },
    {
        img:"/left4.jpeg",
        lines:[
            { emoji:"🚀", ru:"Подготовка востребованных IT-специалистов", kz:"Сұранысқа ие IT мамандарын даярлау", en:"Training in-demand IT professionals" },
            { emoji:"📈", ru:"98% выпускников трудоустраиваются по специальности", kz:"Түлектердің 98% мамандығы бойынша жұмысқа орналасады", en:"98% of graduates employed in their field" }
        ]
    }
];

var rightSlides = [
    {
        img:"/right1.jpeg",
        lines:[
            { emoji:"📋", ru:"Приём документов: 9 и 11 классы", kz:"Құжат қабылдау: 9 және 11 сыныптар", en:"Admission: grade 9 & 11 graduates" },
            { emoji:"📝", ru:"Бюджетные и платные места", kz:"Бюджеттік және ақылы орындар", en:"State-funded & tuition-based places" }
        ]
    },
    {
        img:"/right2.jpeg",
        lines:[
            { emoji:"🌐", ru:"Телекоммуникации и инфобезопасность", kz:"Телекоммуникация және ақпараттық қауіпсіздік", en:"Telecommunications & information security" },
            { emoji:"🔐", ru:"Направления, задающие тон целым отраслям", kz:"Салаларды дамытатын бағыттар", en:"Fields shaping entire industries" }
        ]
    },
    {
        img:"/right3.jpeg",
        lines:[
            { emoji:"🤝", ru:"Практика на реальных проектах с первого курса", kz:"Бірінші курстан бастап нақты жобаларда тәжірибе", en:"Real-project practice from year one" },
            { emoji:"🏢", ru:"Партнёрство с ведущими IT-компаниями", kz:"Жетекші IT компаниялармен серіктестік", en:"Partnerships with leading IT companies" }
        ]
    },
    {
        img:"/right4.jpeg",
        lines:[
            { emoji:"🎓", ru:"Диплом государственного образца", kz:"Мемлекеттік үлгідегі диплом", en:"State-recognized diploma" },
            { emoji:"🌟", ru:"Твоё будущее начинается здесь!", kz:"Сенің болашағың осы жерден басталады!", en:"Your future starts here!" }
        ]
    }
];

function renderLines(lines){
    return lines.map(function(l){
        return '<div class="text-line">' +
            '<div class="emoji">' + l.emoji + '</div>' +
            '<div class="langs">' +
                '<div class="ru">' + l.ru + '</div>' +
                '<div class="kz">' + l.kz + '</div>' +
                '<div class="en">' + l.en + '</div>' +
            '</div>' +
        '</div>';
    }).join('');
}

function buildPhoto(containerId, slidesData){
    var container = document.getElementById(containerId);
    for(var i = 0; i < slidesData.length; i++){
        var div = document.createElement("div");
        div.className = i === 0 ? "slide active" : "slide";
        div.innerHTML = '<img src="' + slidesData[i].img + '">';
        container.appendChild(div);
    }
}

buildPhoto("leftPhoto", leftSlides);
buildPhoto("rightPhoto", rightSlides);

document.getElementById("leftText").innerHTML = renderLines(leftSlides[0].lines);
document.getElementById("rightText").innerHTML = renderLines(rightSlides[0].lines);

var currentSlide = 0;

function rotateAds(){
    var lPhotos = document.querySelectorAll("#leftPhoto .slide");
    var rPhotos = document.querySelectorAll("#rightPhoto .slide");
    var next = (currentSlide + 1) % leftSlides.length;

    lPhotos[currentSlide].classList.remove("active");
    rPhotos[currentSlide].classList.remove("active");
    lPhotos[next].classList.add("active");
    rPhotos[next].classList.add("active");

    document.getElementById("leftText").innerHTML = renderLines(leftSlides[next].lines);
    document.getElementById("rightText").innerHTML = renderLines(rightSlides[next].lines);

    currentSlide = next;
}

setInterval(rotateAds, 30000);

var lastNumber = null;
var lastQueue = "";

function loadAll(){
    fetch("/current")
    .then(function(r){ return r.json(); })
    .then(function(current){
        if(current && current.number !== lastNumber) lastNumber = current.number;
        document.getElementById("current").innerText = current ? current.number : "---";
    })
    .catch(function(){});

    fetch("/queue")
    .then(function(r){ return r.json(); })
    .then(function(data){
        var newData = JSON.stringify(data);
        if(newData === lastQueue) return;
        lastQueue = newData;
        var container = document.getElementById("queue");
        container.innerHTML = "";
        data.forEach(function(p, index){
            var div = document.createElement("div");
            div.className = index === 0 ? "queue-row first" : "queue-row";
            div.innerHTML =
                '<div class="num">' + p.number + '</div>' +
                '<div class="name">' + p.name + '</div>' +
                '<div class="desk">стол ' + p.desk + '</div>';
            container.appendChild(div);
        });
    })
    .catch(function(){});
}

setInterval(loadAll, 2000);
loadAll();
</script>

</body>
</html>
