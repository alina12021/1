<!DOCTYPE html>
<html>
<head>
<title>Очередь</title>
<style>
body{
    margin:0;
    background:#111;
    font-family:Arial, sans-serif;
    display:flex;
    height:100vh;
    overflow:hidden;
}
.side{
    width:22%;
    display:flex;
    flex-direction:column;
    background:#1a1a1a;
}
.side-photo{
    height:65%;
    position:relative;
    overflow:hidden;
    background:black;
}
.slide{
    position:absolute;
    inset:0;
    opacity:0;
    transition:opacity 1s ease;
}
.slide.active{
    opacity:1;
}
.slide img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}
.side-text{
    height:35%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:#111;
    border-top:3px solid #1e3cff;
}
.ad-text{
    color:white;
    font-size:17px;
    line-height:1.8;
    font-weight:bold;
    text-align:center;
    text-shadow:0 1px 6px rgba(0,0,0,0.8);
    opacity:0;
    transition:opacity 0.5s ease;
}
.ad-text.visible{
    opacity:1;
}
.center{
    width:56%;
    background:#f2f2f2;
    display:flex;
    flex-direction:column;
}
.header{
    background:white;
    border-bottom:6px solid #1e3cff;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    position:relative;
}
.logo{
    position:absolute;
    left:20px;
    width:70px;
}
.header-title{
    font-size:38px;
    font-weight:bold;
    color:black;
}
.current-box{
    background:#7a7a7a;
    text-align:center;
    padding:35px 20px;
}
.current-text{
    font-size:28px;
    color:black;
}
.current-number{
    font-size:100px;
    font-weight:bold;
    color:#1e3cff;
    animation:pulse 2s infinite;
}
.queue{
    flex:1;
    overflow:hidden;
    padding:25px;
}
.queue-row{
    display:grid;
    grid-template-columns:1fr 2fr 1fr;
    align-items:center;
    padding:18px 10px;
    border-bottom:2px solid #d9d9d9;
    font-size:28px;
    color:black;
    animation:fadeIn 0.4s ease;
}
.num{
    font-weight:bold;
}
.name{
    text-align:center;
}
.desk{
    text-align:right;
}
.first{
    color:#1e3cff;
    font-weight:bold;
    background:#e9edff;
    border-radius:12px;
}
@keyframes fadeIn{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
}
@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.05);}
    100%{transform:scale(1);}
}
@media(max-width:1200px){
    .side{display:none;}
    .center{width:100%;}
    .current-number{font-size:70px;}
    .queue-row{font-size:18px;}
}
</style>
</head>
<body>

<div class="side">
    <div class="side-photo" id="leftPhoto"></div>
    <div class="side-text">
        <div class="ad-text" id="leftText"></div>
    </div>
</div>

<div class="center">
    <div class="header">
        <img src="/logo.png" class="logo">
        <div class="header-title">ПРИЁМНАЯ КОМИССИЯ</div>
    </div>
    <div class="current-box">
        <div class="current-text">СЕЙЧАС ОБСЛУЖИВАЕТСЯ</div>
        <div id="current" class="current-number">---</div>
    </div>
    <div class="queue" id="queue"></div>
</div>

<div class="side">
    <div class="side-photo" id="rightPhoto"></div>
    <div class="side-text">
        <div class="ad-text" id="rightText"></div>
    </div>
</div>

<script>
const slides = [
    {
        left:"/left1.jpeg",
        right:"/right1.jpeg",
        text:`🎓 15+ IT и технических специальностей<br>🎓 15+ IT және техникалық мамандықтар<br>🎓 15+ IT and technical specialties`
    },
    {
        left:"/left2.jpeg",
        right:"/right2.jpeg",
        text:`🏆 Победители WorldSkills Kazakhstan<br>🏆 WorldSkills Kazakhstan жеңімпаздары<br>🏆 Winners of WorldSkills Kazakhstan`
    },
    {
        left:"/left3.jpeg",
        right:"/right3.jpeg",
        text:`💻 Современные лаборатории и IT-классы<br>💻 Заманауи зертханалар мен IT сыныптары<br>💻 Modern laboratories and IT classrooms`
    },
    {
        left:"/left4.jpeg",
        right:"/right4.jpeg",
        text:`🚀 Подготовка востребованных IT-специалистов<br>🚀 Сұранысқа ие IT мамандарын даярлау<br>🚀 Training highly demanded IT specialists`
    }
];

function buildPhotoSlides(containerId, imgKey){
    const container = document.getElementById(containerId);
    slides.forEach((s, i) => {
        const div = document.createElement("div");
        div.className = "slide" + (i === 0 ? " active" : "");
        div.innerHTML = `<img src="${s[imgKey]}">`;
        container.appendChild(div);
    });
}

buildPhotoSlides("leftPhoto", "left");
buildPhotoSlides("rightPhoto", "right");

const leftText = document.getElementById("leftText");
const rightText = document.getElementById("rightText");

function setTextBothSides(text){
    leftText.classList.remove("visible");
    rightText.classList.remove("visible");
    setTimeout(() => {
        leftText.innerHTML = text;
        rightText.innerHTML = text;
        leftText.classList.add("visible");
        rightText.classList.add("visible");
    }, 400);
}

setTextBothSides(slides[0].text);

let currentSlide = 0;

function rotateAds(){
    const leftSlides = document.querySelectorAll("#leftPhoto .slide");
    const rightSlides = document.querySelectorAll("#rightPhoto .slide");
    const next = (currentSlide + 1) % slides.length;

    leftSlides[currentSlide].classList.remove("active");
    rightSlides[currentSlide].classList.remove("active");
    leftSlides[next].classList.add("active");
    rightSlides[next].classList.add("active");

    setTextBothSides(slides[next].text);

    currentSlide = next;
}

setInterval(rotateAds, 30000);

let lastNumber = null;
let lastQueue = "";

async function loadAll(){
    try {
        let current = await fetch("/current").then(r => r.json());
        if(current && current.number !== lastNumber){
            lastNumber = current.number;
        }
        document.getElementById("current").innerText = current ? current.number : "---";
    } catch(e){}

    try {
        let data = await fetch("/queue").then(r => r.json());
        let newData = JSON.stringify(data);
        if(newData === lastQueue) return;
        lastQueue = newData;

        let container = document.getElementById("queue");
        container.innerHTML = "";

        data.forEach((p, index) => {
            let div = document.createElement("div");
            div.className = "queue-row";
            if(index === 0) div.classList.add("first");
            div.innerHTML = `
                <div class="num">${p.number}</div>
                <div class="name">${p.name}</div>
                <div class="desk">стол ${p.desk}</div>
            `;
            container.appendChild(div);
        });
    } catch(e){}
}

setInterval(loadAll, 2000);
loadAll();
</script>

</body>
</html>
