<!DOCTYPE html>
<html>
<head>
<title>Очередь</title>

<style>

body{
    margin:0;
    background:#111;
    font-family:Arial, sans-serif;
    display:flex;
    height:100vh;
    overflow:hidden;
}

/* ===== БОКОВЫЕ ФОТО ===== */

.side{

    width:22%;

    position:relative;

    overflow:hidden;

    background:black;

    display:flex;

    align-items:flex-end;

    justify-content:center;
}

.side img{

    width:100%;

    height:100%;

    object-fit:cover;

    transition:1s;

    position:absolute;

    top:0;
    left:0;

    z-index:1;
}

.overlay{

    position:absolute;

    inset:0;

    background:linear-gradient(
        to top,
        rgba(0,0,0,0.85),
        rgba(0,0,0,0.1)
    );

    z-index:2;
}

/* ===== ТЕКСТ НА ФОТО ===== */

.ad-text{

    position:absolute;

    left:20px;

    right:20px;

    bottom:30px;

    z-index:5;

    color:white;

    font-size:19px;

    line-height:1.7;

    font-weight:bold;

    text-shadow:0 2px 10px black;

    animation:fadeIn 0.5s ease;
}

/* ===== ЦЕНТР ===== */

.center{

    width:56%;

    background:#f2f2f2;

    display:flex;

    flex-direction:column;
}

/* ===== ШАПКА ===== */

.header{

    background:white;

    border-bottom:6px solid #1e3cff;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

    position:relative;
}

.logo{

    position:absolute;

    left:20px;

    width:70px;
}

.header-title{

    font-size:38px;

    font-weight:bold;

    color:black;
}

/* ===== ТЕКУЩИЙ НОМЕР ===== */

.current-box{

    background:#7a7a7a;

    text-align:center;

    padding:35px 20px;
}

.current-text{

    font-size:28px;

    color:black;
}

.current-number{

    font-size:100px;

    font-weight:bold;

    color:#1e3cff;

    animation:pulse 2s infinite;
}

/* ===== ОЧЕРЕДЬ ===== */

.queue{

    flex:1;

    overflow:hidden;

    padding:25px;
}

.queue-row{

    display:grid;

    grid-template-columns:
        1fr
        2fr
        1fr;

    align-items:center;

    padding:18px 10px;

    border-bottom:2px solid #d9d9d9;

    font-size:28px;

    color:black;

    animation:fadeIn 0.4s ease;
}

.num{
    font-weight:bold;
}

.name{
    text-align:center;
}

.desk{
    text-align:right;
}

.first{

    color:#1e3cff;

    font-weight:bold;

    background:#e9edff;

    border-radius:12px;
}

/* ===== АНИМАЦИИ ===== */

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes pulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.05);
    }

    100%{
        transform:scale(1);
    }
}

/* ===== АДАПТИВ ===== */

@media(max-width:1200px){

    .side{
        display:none;
    }

    .center{
        width:100%;
    }

    .current-number{
        font-size:70px;
    }

    .queue-row{
        font-size:18px;
    }
}

</style>
</head>

<body>

<!-- ЛЕВАЯ СТОРОНА -->

<div class="side">

    <img id="leftImg" src="/left1.jpeg">

    <div class="overlay"></div>

    <div class="ad-text" id="leftText">
        Загрузка...
    </div>

</div>

<!-- ЦЕНТР -->

<div class="center">

    <div class="header">

        <img src="/logo.png" class="logo">

        <div class="header-title">
            ПРИЁМНАЯ КОМИССИЯ
        </div>

    </div>

    <div class="current-box">

        <div class="current-text">
            СЕЙЧАС ОБСЛУЖИВАЕТСЯ
        </div>

        <div id="current" class="current-number">
            ---
        </div>

    </div>

    <div class="queue" id="queue"></div>

</div>

<!-- ПРАВАЯ СТОРОНА -->

<div class="side">

    <img id="rightImg" src="/right1.jpeg">

    <div class="overlay"></div>

    <div class="ad-text" id="rightText">
        Загрузка...
    </div>

</div>

<script>



let lastNumber = null;
let lastQueue = "";

// ===== ЗАГРУЗКА ОЧЕРЕДИ =====

async function loadAll(){

    // текущий номер

    let current =
        await fetch("/current")
        .then(r => r.json());

    if(current && current.number !== lastNumber){

        audio.play().catch(()=>{});

        lastNumber =
            current.number;
    }

    document.getElementById("current")
    .innerText =

        current
            ? current.number
            : "---";

    // очередь

    let data =
        await fetch("/queue")
        .then(r => r.json());

    let newData =
        JSON.stringify(data);

    if(newData === lastQueue)
        return;

    lastQueue = newData;

    let container =
        document.getElementById("queue");

    container.innerHTML = "";

    data.forEach((p,index)=>{

        let div =
            document.createElement("div");

        div.className =
            "queue-row";

        if(index === 0){

            div.classList.add("first");
        }

        div.innerHTML = `

            <div class="num">
                ${p.number}
            </div>

            <div class="name">
                ${p.name}
            </div>

            <div class="desk">
                стол ${p.desk}
            </div>
        `;

        container.appendChild(div);
    });
}

setInterval(loadAll,2000);

loadAll();

// ===== СЛАЙДЫ =====

const slides = [

{
    left:"/left1.jpeg",
    right:"/right1.jpeg",

    text:`
    🎓 15+ IT и технических специальностей<br>
    🎓 15+ IT және техникалық мамандықтар<br>
    🎓 15+ IT and technical specialties
    `
},

{
    left:"/left2.jpeg",
    right:"/right2.jpeg",

    text:`
    🏆 Победители WorldSkills Kazakhstan<br>
    🏆 WorldSkills Kazakhstan жеңімпаздары<br>
    🏆 Winners of WorldSkills Kazakhstan
    `
},

{
    left:"/left3.jpeg",
    right:"/right3.jpeg",

    text:`
    💻 Современные лаборатории и IT-классы<br>
    💻 Заманауи зертханалар мен IT сыныптары<br>
    💻 Modern laboratories and IT classrooms
    `
},

{
    left:"/left4.jpeg",
    right:"/right4.jpeg",

    text:`
    🚀 Подготовка востребованных IT-специалистов<br>
    🚀 Сұранысқа ие IT мамандарын даярлау<br>
    🚀 Training highly demanded IT specialists
    `
}

];

let currentSlide = 0;

// ===== СМЕНА ФОТО =====

function rotateAds(){

    document.getElementById("leftImg").src =
        slides[currentSlide].left;

    document.getElementById("rightImg").src =
        slides[currentSlide].right;

    document.getElementById("leftText").innerHTML =
        slides[currentSlide].text;

    document.getElementById("rightText").innerHTML =
        slides[currentSlide].text;

    currentSlide++;

    if(currentSlide >= slides.length){

        currentSlide = 0;
    }
}

window.onload = () => {

    rotateAds();

    setInterval(rotateAds,30000);
};

</script>

</body>
</html>
