<!DOCTYPE html>
<html>
<head>
<title>Админ панель</title>
<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0b0b0b;
    color:white;
    padding:30px;
}
h1{
    text-align:center;
    color:#1e3cff;
    margin-bottom:30px;
    font-size:42px;
}
.controls{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:30px;
}
button{
    padding:14px 22px;
    border:none;
    border-radius:12px;
    background:#1e3cff;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}
button:hover{
    transform:scale(1.05);
    background:#1630cc;
}
.current-box{
    background:#161616;
    border:2px solid #1e3cff;
    border-radius:20px;
    padding:25px;
    margin-bottom:30px;
    text-align:center;
}
.current-title{
    font-size:22px;
    opacity:0.8;
}
.current-number{
    font-size:70px;
    font-weight:bold;
    color:#1e3cff;
    margin-top:10px;
}
.queue{
    display:flex;
    flex-direction:column;
    gap:12px;
}
.person{
    background:#151515;
    border-left:6px solid #1e3cff;
    border-radius:16px;
    padding:18px;
    display:grid;
    grid-template-columns:120px 1fr 180px 120px 250px;
    align-items:center;
    gap:10px;
    animation:fadeIn 0.4s ease;
}
.person:hover{
    transform:scale(1.01);
}
.num{
    font-size:28px;
    font-weight:bold;
    color:#1e3cff;
}
.name{ font-size:20px; }
.service{ font-size:18px; opacity:0.9; }
.desk{ font-size:18px; }
.time{ font-size:16px; opacity:0.7; }
.actions{ display:flex; gap:8px; flex-wrap:wrap; }
.delete-btn{ background:#ff2f2f; }
.edit-btn{ background:#ffaa00; }
.stats{
    margin-top:35px;
    background:#151515;
    border-radius:18px;
    padding:25px;
    border:2px solid #1e3cff;
}
.stats h2{ margin-top:0; color:#1e3cff; }
.stat-row{ margin:10px 0; font-size:18px; }

.login-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.92);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
}
.login-box{
    background:#151515;
    border:2px solid #1e3cff;
    border-radius:20px;
    padding:40px;
    text-align:center;
    width:320px;
}
.login-box h2{
    margin-top:0;
    color:#1e3cff;
    font-size:26px;
}
.login-box input{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:2px solid #333;
    background:#0b0b0b;
    color:white;
    font-size:18px;
    text-align:center;
    box-sizing:border-box;
    margin:16px 0;
    letter-spacing:4px;
}
.login-box input:focus{
    outline:none;
    border-color:#1e3cff;
}
.login-box .error{
    color:#ff4444;
    font-size:15px;
    margin-top:8px;
    min-height:20px;
}
.content{ display:none; }

@keyframes fadeIn{
    from{opacity:0;transform:translateY(15px);}
    to{opacity:1;transform:translateY(0);}
}
@keyframes shake{
    0%,100%{transform:translateX(0);}
    20%,60%{transform:translateX(-8px);}
    40%,80%{transform:translateX(8px);}
}
@media(max-width:1200px){
    .person{ grid-template-columns:1fr; text-align:center; }
    .actions{ justify-content:center; }
}
</style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
    <div class="login-box">
        <h2>🔐 Вход в панель</h2>
        <p style="opacity:0.6;margin:0;">Введите пароль администратора</p>
        <input type="password" id="passwordInput" placeholder="••••••••" onkeydown="if(event.key==='Enter') checkPassword()">
        <button onclick="checkPassword()" style="width:100%;font-size:18px;padding:14px;">Войти</button>
        <div class="error" id="loginError"></div>
    </div>
</div>

<div class="content" id="content">
    <h1>АДМИН ПАНЕЛЬ</h1>

    <div class="controls">
        <button onclick="nextPerson()">▶ Следующий</button>
        <button onclick="skipPerson()">⏭ Пропустить</button>
        <button onclick="recallPerson()">🔊 Повторить</button>
        <button onclick="resetQueue()">🗑 Очистить</button>
        <button onclick="logout()" style="background:#444;">🚪 Выйти</button>
    </div>

    <div class="current-box">
        <div class="current-title">Сейчас обслуживается</div>
        <div class="current-number" id="current">---</div>
    </div>

    <div class="queue" id="queue"></div>

    <div class="stats">
        <h2>Статистика</h2>
        <div class="stat-row" id="total"></div>
        <div class="stat-row" id="served"></div>
        <div class="stat-row" id="desk1"></div>
        <div class="stat-row" id="desk2"></div>
        <div class="stat-row" id="desk3"></div>
        <div class="stat-row" id="desk4"></div>
        <div class="stat-row" id="desk5"></div>
    </div>
</div>

<script>
var ADMIN_PASSWORD = "102030";
var lastQueue = "";
var interval = null;

function checkPassword(){
    var input = document.getElementById("passwordInput").value;
    if(input === ADMIN_PASSWORD){
        sessionStorage.setItem("adminAuth", "true");
        showPanel();
    } else {
        var box = document.getElementById("passwordInput");
        box.style.animation = "shake 0.4s ease";
        setTimeout(function(){ box.style.animation = ""; }, 400);
        document.getElementById("loginError").innerText = "Неверный пароль. Попробуйте снова.";
        document.getElementById("passwordInput").value = "";
    }
}

function showPanel(){
    document.getElementById("loginOverlay").style.display = "none";
    document.getElementById("content").style.display = "block";
    loadAll();
    interval = setInterval(loadAll, 2000);
}

function logout(){
    sessionStorage.removeItem("adminAuth");
    clearInterval(interval);
    document.getElementById("content").style.display = "none";
    document.getElementById("loginOverlay").style.display = "flex";
    document.getElementById("passwordInput").value = "";
    document.getElementById("loginError").innerText = "";
}

if(sessionStorage.getItem("adminAuth") === "true"){
    showPanel();
}

function loadAll(){
    fetch("/current")
    .then(function(r){ return r.json(); })
    .then(function(current){
        document.getElementById("current").innerText = current ? current.number : "---";
    })
    .catch(function(){});

    fetch("/queue")
    .then(function(r){ return r.json(); })
    .then(function(data){
        var newData = JSON.stringify(data);
        if(newData === lastQueue) return;
        lastQueue = newData;
        var container = document.getElementById("queue");
        container.innerHTML = "";
        data.forEach(function(person){
            var div = document.createElement("div");
            div.className = "person";
            div.innerHTML =
                '<div class="num">' + person.number + '</div>' +
                '<div class="name">' + person.name + '</div>' +
                '<div class="service">' + person.request + '</div>' +
                '<div class="desk">Стол ' + person.desk + '</div>' +
                '<div>' +
                    '<div class="time">' + person.time + '</div>' +
                    '<div class="actions">' +
                        '<button class="edit-btn" onclick="editPerson(\'' + person.number + '\')">✏ Ред.</button>' +
                        '<button class="delete-btn" onclick="deletePerson(\'' + person.number + '\')">✖ Удалить</button>' +
                    '</div>' +
                '</div>';
            container.appendChild(div);
        });
    })
    .catch(function(){});

    fetch("/stats")
    .then(function(r){ return r.json(); })
    .then(function(stats){
        document.getElementById("total").innerText = "Всего людей: " + stats.total;
        document.getElementById("served").innerText = "Обслужено: " + stats.served;
        document.getElementById("desk1").innerText = "Стол 1: " + stats.desks[1];
        document.getElementById("desk2").innerText = "Стол 2: " + stats.desks[2];
        document.getElementById("desk3").innerText = "Стол 3: " + stats.desks[3];
        document.getElementById("desk4").innerText = "Стол 4: " + stats.desks[4];
        document.getElementById("desk5").innerText = "Стол 5: " + (stats.desks[5] || 0);
    })
    .catch(function(){});
}

function nextPerson(){
    fetch("/next", { method:"POST" }).then(function(){ loadAll(); });
    document.body.style.opacity = 0.7;
    setTimeout(function(){ document.body.style.opacity = 1; }, 200);
}
function skipPerson(){
    fetch("/skip", { method:"POST" }).then(function(){ loadAll(); });
}
function recallPerson(){
    fetch("/recall", { method:"POST" }).then(function(){ loadAll(); });
}
function deletePerson(number){
    fetch("/queue/" + number, { method:"DELETE" }).then(function(){ loadAll(); });
}
function editPerson(number){
    var name = prompt("Новое ФИО");
    if(!name) return;
    var request = prompt("Новая услуга");
    if(!request) return;
    fetch("/queue/" + number, {
        method:"PUT",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({ name:name, request:request })
    }).then(function(){ loadAll(); });
}
function resetQueue(){
    if(!confirm("Очистить очередь?")) return;
    fetch("/reset", { method:"POST" }).then(function(){ loadAll(); });
}
</script>

</body>
</html>
